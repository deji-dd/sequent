services:
  sequent:
    image: ghcr.io/deji-dd/sequent:${SEQUENT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sequent
    restart: unless-stopped
    ports:
      - "${SEQUENT_PORT:-3003}:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: ${POSTGRES_DB:-sequent_db}
      POSTGRES_USER: ${POSTGRES_USER:-sequent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Host socket directories mounted for low-latency IPC
      - /var/run/postgres-sockets:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3003/api/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: sequent_net
